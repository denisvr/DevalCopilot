[package]
name = "devalcopilot"
version = "0.1.0"
description = "DevalCopilot desktop shell: window lifecycle and packaged .NET sidecar ownership only."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
# Test-only additions over the [dependencies] tokio feature set: macros for #[tokio::test],
# rt for its executor, test-util for start_paused (deterministic timeout tests with no real
# wall-clock wait).
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "test-util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
